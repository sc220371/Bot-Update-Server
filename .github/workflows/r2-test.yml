name: R2 連線測試（手動執行，可隨時刪除）
on:
  workflow_dispatch:        # 只能手動觸發，不會自己跑

env:
  R2_ENDPOINT: https://3d80f8699fca3f99e08e9708052bcdd6.r2.cloudflarestorage.com
  R2_BUCKET: bot-update
  R2_PUBLIC_BASE: https://pub-4db41c09021443f8a6a88a36f45c0b1b.r2.dev

jobs:
  test-r2:
    runs-on: ubuntu-latest
    steps:
      - name: 產生 50MB 測試檔
        run: |
          head -c 50000000 /dev/urandom > test.bin
          ls -lh test.bin
          sha256sum test.bin

      - name: 上傳到 R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          aws s3 cp test.bin "s3://${R2_BUCKET}/_speedtest/test.bin" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type application/octet-stream
          echo "✅ 上傳成功"
          echo "測試網址： ${R2_PUBLIC_BASE}/_speedtest/test.bin"
