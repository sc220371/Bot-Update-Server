name: 發布後自動更新 version.json
# 觸發時機：
#   1. 有 release 被「發布」時自動執行
#   2. 每 15 分鐘自動檢查一次（保險）：最新的 release 比 version.json 新、卻還沒處理，就自動補做
#      ⚠ 為什麼要這條：v14.2（2026-09-22）與 v14.3（2026-09-29）發布時，GitHub 都沒送出 release 事件，
#        兩次都是 exe 還在上傳時就按了 Publish（上傳完成與發布在同一秒）；之前 exe 傳完幾秒後才按的
#        v13.61／v14.0／v14.1 都正常。有了定時檢查，就算事件漏掉，最慢十幾分鐘也會自己補上。
#   3. 手動執行（Actions → 這個 workflow → Run workflow）：tag 留空＝處理最新的 release；
#      填 tag＝不管 version.json 是不是已經是那一版都重做一次（救援用）。
on:
  release:
    types: [published]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: '要處理的版本 tag（例如 v14.3）；留空＝最新的 release'
        required: false
        type: string

permissions:
  contents: write

# 發布事件與定時檢查可能同時跑到同一版：排隊一個一個來，後面那個會看到 version.json 已經更新而跳過
concurrency:
  group: update-version-json
  cancel-in-progress: false

env:
  R2_ENDPOINT: https://3d80f8699fca3f99e08e9708052bcdd6.r2.cloudflarestorage.com
  R2_BUCKET: bot-update
  R2_PUBLIC_BASE: https://pub-4db41c09021443f8a6a88a36f45c0b1b.r2.dev

jobs:
  update-version-json:
    runs-on: ubuntu-latest
    steps:
      - name: 取得主分支
        uses: actions/checkout@v5
        with:
          ref: main

      # ── 0. 決定要處理哪一版、要不要處理 ──
      #    release 事件用事件帶的 tag，手動執行用填的，都沒有（定時檢查）就查最新的 release。
      #    除了「手動指定 tag」以外，version.json 已經是這一版或更新的就跳過，不重複上傳／公告。
      - name: 決定版本
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${EVENT_TAG:-$INPUT_TAG}"
          FORCE=0
          if [ -n "$INPUT_TAG" ]; then FORCE=1; fi
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName 2>/dev/null || true)
            if [ -z "$TAG" ]; then
              echo "目前沒有已發布的 release，不用處理"
              echo "SKIP=1" >> "$GITHUB_ENV"
              exit 0
            fi
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

          if [ "$FORCE" != "1" ]; then
            if python3 - "$TAG" << 'PYEOF'
          import json, sys
          tag = sys.argv[1].lstrip("vV")
          try:
              cur = float(json.load(open("version.json", encoding="utf-8")).get("latest_version", 0))
          except Exception:
              cur = 0.0
          try:
              new = float(tag)
          except ValueError:
              sys.exit(1)          # 解析不了的 tag 交給下面去報錯
          print(f"version.json 目前 {cur}，最新 release {new}")
          sys.exit(0 if new <= cur else 1)
          PYEOF
            then
              echo "✅ version.json 已經是最新（$TAG），不用處理"
              echo "SKIP=1" >> "$GITHUB_ENV"
              exit 0
            fi
          fi

          if ! gh release view "$TAG" --repo "${{ github.repository }}" \
                 --json body,url > /tmp/rel.json; then
            echo "❌ 找不到 release「$TAG」，請確認 tag 拼字"
            exit 1
          fi
          python3 -c "import json;d=json.load(open('/tmp/rel.json'));open('/tmp/body.md','w',encoding='utf-8').write(d.get('body') or '')"
          python3 -c "import json;d=json.load(open('/tmp/rel.json'));print(d.get('url') or '')" > /tmp/url.txt
          echo "✅ 處理版本：$TAG"

      # ── 1. 把這次 release 的 exe 抓下來 ──
      - name: 下載 release 的 exe
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _asset
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern '*.exe' --dir _asset
          ls -lh _asset
          if [ -z "$(ls -A _asset/*.exe 2>/dev/null)" ]; then
            echo "❌ 這個 release 沒有 .exe 附件，請先上傳 exe 再重新發布"
            exit 1
          fi

      # ── 2. 上傳到 R2（路徑：v<版本>/檔名）──
      - name: 上傳到 Cloudflare R2
        if: env.SKIP != '1'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          EXE=$(ls _asset/*.exe | head -1)
          NAME=$(basename "$EXE")
          aws s3 cp "$EXE" "s3://${R2_BUCKET}/${TAG}/${NAME}" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type application/octet-stream
          echo "ASSET_NAME=$NAME" >> "$GITHUB_ENV"
          echo "✅ 已上傳：${R2_PUBLIC_BASE}/${TAG}/${NAME}"

      # ── 3. 產生 version.json（多帶 sha256）──
      - name: 產生 version.json
        if: env.SKIP != '1'
        run: |
          python3 << 'PYEOF'
          import os, json, hashlib, glob

          tag = (os.environ.get("TAG") or "").strip()
          base = (os.environ.get("R2_PUBLIC_BASE") or "").rstrip("/")
          name = os.environ.get("ASSET_NAME") or ""
          with open("/tmp/body.md", encoding="utf-8") as f:
              body = f.read()

          ver_str = tag.lstrip("vV")
          try:
              latest_version = float(ver_str)
          except ValueError:
              raise SystemExit(f"❌ 無法從 tag「{tag}」解析出版本號，請用 v14.2 這種格式")

          download_url = f"{base}/{tag}/{name}"

          exe = sorted(glob.glob("_asset/*.exe"))[0]
          h = hashlib.sha256()
          with open(exe, "rb") as f:
              for blk in iter(lambda: f.read(1024 * 1024), b""):
                  h.update(blk)
          sha256 = h.hexdigest()
          size = os.path.getsize(exe)

          notes = [f"【乙太助手 {tag} 更新】", ""]
          for line in body.replace("\r\n", "\n").split("\n"):
              s = line.rstrip()
              if s.lstrip().startswith(("- ", "* ")):
                  indent = s[:len(s) - len(s.lstrip())]
                  s = indent + "• " + s.lstrip()[2:]
              notes.append(s)
          while notes and notes[-1] == "":
              notes.pop()

          data = {
              "latest_version": latest_version,
              "download_url": download_url,
              "sha256": sha256,
              "size": size,
              "update_notes": notes,
          }
          with open("version.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print("✅ version.json 已產生：")
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PYEOF

      - name: Commit 並推回主分支
        if: env.SKIP != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          if git diff --cached --quiet; then
            echo "version.json 內容無變化，跳過 commit"
          else
            git commit -m "🤖 自動更新 version.json (${TAG})"
            git push origin main
          fi

      # ── 4. 最後才發 Discord 公告 ──
      #    ⚠ 放在最後而不是另外一支 workflow，有兩個理由：
      #      1. 兩支平行跑的話，Discord 幾乎一定比 R2 上傳（244MB）先完成，
      #         公告出去的當下檔案還沒到位。
      #      2. 上面任何一步失敗就不會發公告，不會出現「公告了但使用者更新不到」。
      - name: 發送到 Discord
        if: env.SKIP != '1'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: |
          python3 << 'PYEOF'
          import os, json, urllib.request, urllib.error

          webhook = os.environ.get("DISCORD_WEBHOOK") or ""
          THREAD_ID = "1507383354843070485"
          if THREAD_ID:
              sep = "&" if "?" in webhook else "?"
              webhook = f"{webhook}{sep}thread_id={THREAD_ID}"

          tag = (os.environ.get("TAG") or "(未知版本)").strip()
          with open("/tmp/body.md", encoding="utf-8") as f:
              body = f.read()
          with open("/tmp/url.txt", encoding="utf-8") as f:
              url = f.read().strip()

          notes = body.strip() or "* (這次沒有填寫更新項目)"
          if url:
              title = f"[乙太助手 {tag} 更新]({url})"
          else:
              title = f"乙太助手 {tag} 更新"
          message = f"## <a:1485675590529843310:1491388875669504132> {title}\n{notes}"
          if len(message) > 1950:
              message = message[:1950] + "\n…(內容過長已截斷)"

          if not webhook:
              print("❌ DISCORD_WEBHOOK 是空的，請確認 repo Secrets 有 DISCORD_RELEASE_WEBHOOK")
              raise SystemExit(1)
          print(f"🔍 webhook 開頭: {webhook[:40]}...")

          payload = {
              "content": message,
              "allowed_mentions": {"parse": []},
          }
          req = urllib.request.Request(
              webhook, data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  # 🔑 必須帶 User-Agent，否則會被 Discord 前面的 Cloudflare 以 error 1010 擋下
                  "User-Agent": "StarRO-Release-Bot/1.0 (+https://github.com/sc220371/Bot-Update-Server)",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  print(f"Discord 回應狀態碼: {resp.status}")
                  print("✅ 版本公告已送出！")
          except urllib.error.HTTPError as e:
              err_body = e.read().decode("utf-8", errors="replace")
              print(f"❌ Discord 拒絕，狀態碼 {e.code}")
              print(f"❌ Discord 回應內容: {err_body}")
              raise
          PYEOF
