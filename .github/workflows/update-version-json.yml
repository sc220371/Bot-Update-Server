name: 發布後自動更新 version.json
# 觸發時機：每當有 release 被「發布」時自動執行
on:
  release:
    types: [published]

permissions:
  contents: write

env:
  # ── R2 設定（非機密，放這裡就好；金鑰放在 repo Secrets）──
  R2_ENDPOINT: https://3d80f8699fca3f99e08e9708052bcdd6.r2.cloudflarestorage.com
  R2_BUCKET: bot-update
  # ⚠ 把下面這行換成你 R2 的 Public Development URL（結尾不要留斜線）
  R2_PUBLIC_BASE: https://pub-4db41c09021443f8a6a88a36f45c0b1b.r2.dev

jobs:
  update-version-json:
    runs-on: ubuntu-latest
    steps:
      - name: 取得主分支
        uses: actions/checkout@v4
        with:
          ref: main

      # ── 1. 把這次 release 的 exe 抓下來 ──
      - name: 下載 release 的 exe
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p _asset
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern '*.exe' --dir _asset
          ls -lh _asset
          # 沒有 exe 就直接失敗，不要產生一個指向不存在檔案的 version.json
          if [ -z "$(ls -A _asset/*.exe 2>/dev/null)" ]; then
            echo "❌ 這個 release 沒有 .exe 附件，請先上傳 exe 再重新發布"
            exit 1
          fi

      # ── 2. 上傳到 R2（路徑：v<版本>/檔名）──
      - name: 上傳到 Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 不吃 AWS CLI 新版預設會送的 checksum 標頭，關掉避免上傳失敗
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          TAG: ${{ github.event.release.tag_name }}
        run: |
          EXE=$(ls _asset/*.exe | head -1)
          NAME=$(basename "$EXE")
          aws s3 cp "$EXE" "s3://${R2_BUCKET}/${TAG}/${NAME}" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type application/octet-stream
          echo "ASSET_NAME=$NAME" >> "$GITHUB_ENV"
          echo "✅ 已上傳：${R2_PUBLIC_BASE}/${TAG}/${NAME}"

      # ── 3. 產生 version.json（多帶 sha256）──
      - name: 產生 version.json
        env:
          TAG: ${{ github.event.release.tag_name }}
          BODY: ${{ github.event.release.body }}
        run: |
          python3 << 'PYEOF'
          import os, json, hashlib, glob

          tag = (os.environ.get("TAG") or "").strip()          # 例如 v14.2
          body = os.environ.get("BODY") or ""
          base = (os.environ.get("R2_PUBLIC_BASE") or "").rstrip("/")
          name = os.environ.get("ASSET_NAME") or ""

          # --- 1. 版本號：v14.2 → 14.2 (維持 JSON 數字型別，與舊格式一致) ---
          ver_str = tag.lstrip("vV")
          try:
              latest_version = float(ver_str)
          except ValueError:
              raise SystemExit(f"❌ 無法從 tag「{tag}」解析出版本號，請用 v14.2 這種格式")

          # --- 2. 下載連結：指向 R2（GitHub 那份仍在，只是不當主要下載來源）---
          download_url = f"{base}/{tag}/{name}"

          # --- 3. 檔案 SHA256：程式下載後會比對，抓壞或被掉包都能擋下來 ---
          exe = sorted(glob.glob("_asset/*.exe"))[0]
          h = hashlib.sha256()
          with open(exe, "rb") as f:
              for blk in iter(lambda: f.read(1024 * 1024), b""):
                  h.update(blk)
          sha256 = h.hexdigest()
          size = os.path.getsize(exe)

          # --- 4. 更新說明：標題 + release 內文逐行帶入 ---
          notes = [f"【乙太助手 {tag} 更新】", ""]
          for line in body.replace("\r\n", "\n").split("\n"):
              s = line.rstrip()
              if s.lstrip().startswith(("- ", "* ")):
                  indent = s[:len(s) - len(s.lstrip())]
                  s = indent + "• " + s.lstrip()[2:]
              notes.append(s)
          while notes and notes[-1] == "":
              notes.pop()

          data = {
              "latest_version": latest_version,
              "download_url": download_url,
              "sha256": sha256,
              "size": size,
              "update_notes": notes,
          }
          with open("version.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print("✅ version.json 已產生：")
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PYEOF

      - name: Commit 並推回主分支
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          if git diff --cached --quiet; then
            echo "version.json 內容無變化，跳過 commit"
          else
            git commit -m "🤖 自動更新 version.json (${{ github.event.release.tag_name }})"
            git push origin main
          fi
